kind = "web"
previewPath = "/"
title = "China Source Student"
description = "A bilingual English and Arabic landing page that helps international students in China learn 1688 sourcing, identify factories, and connect with shipping resources."
version = "1.0.0"
id = "artifacts/china-source-student"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21712

[services.development]
run = "pnpm --filter @workspace/china-source-student run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/china-source-student", "run", "build" ]
serve = "static"
publicDir = "artifacts/china-source-student/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21712"
BASE_PATH = "/"
